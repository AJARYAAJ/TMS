# Local infrastructure for Workora: PostgreSQL (source of truth) and Redis
# (rate limiting, job queue, realtime fan-out).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workora
      POSTGRES_PASSWORD: workora
      POSTGRES_DB: workora
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workora']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  pgdata:
